[project]
name = "native-agent-starter"
version = "0.1.0"
description = "Dependency-free agent runtime with tools, approvals, memory, traces and a web UI"
requires-python = ">=3.11"

[project.scripts]
native-agent = "agent_native.api:main"
langchain-agent = "agent_langchain.cli:main"

[project.optional-dependencies]
langchain = ["langchain>=1.0,<2", "langchain-openai>=1.0,<2", "langchain-ollama>=1.1,<2", "llama-index-core>=0.14.24,<0.15", "llama-index-retrievers-bm25>=0.6.5,<0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_native*", "agent_langchain*"]

[tool.ruff]
line-length = 100
