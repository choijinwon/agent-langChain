<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f19">
  <title>Native Agent</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">N</span><span>Native Agent</span></div>
      <button id="new-chat" class="new-chat"><span>＋</span> 새 대화</button>
      <div class="section-label">RECENT</div>
      <nav id="sessions" class="sessions"></nav>
      <div class="sidebar-bottom">
        <div class="status-dot"></div>
        <div><strong id="provider-name">Demo Runtime</strong><span id="model-name">local planner</span></div>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button id="menu" class="icon-button" aria-label="메뉴">☰</button>
        <div><h1>Operations Copilot</h1><span id="runtime-label">도구 · 승인 · 메모리 · 추적</span></div>
        <button id="trace-button" class="trace-button" disabled><span>◎</span> 실행 추적</button>
      </header>

      <section id="conversation" class="conversation">
        <div id="welcome" class="welcome">
          <div class="orb"><div class="orb-core">N</div></div>
          <p class="eyebrow">ENTERPRISE AGENT RUNTIME</p>
          <h2>무엇을 함께 처리할까요?</h2>
          <p class="welcome-copy">필요한 도구를 스스로 선택하고, 중요한 변경은<br>당신의 승인을 받은 뒤 안전하게 실행합니다.</p>
          <div class="suggestions">
            <button data-prompt="128 * 42를 계산해줘"><span>⌁</span><b>빠른 계산</b><small>128 × 42 결과 알려줘</small></button>
            <button data-prompt="휴가 정책을 찾아줘"><span>⌕</span><b>지식 검색</b><small>사내 휴가 정책 찾아줘</small></button>
            <button data-prompt="금요일까지 보안 리뷰 할 일을 만들어줘"><span>✓</span><b>승인형 실행</b><small>새 할 일 생성해줘</small></button>
          </div>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
      </section>

      <div class="composer-wrap">
        <form id="composer" class="composer">
          <textarea id="prompt" rows="1" placeholder="Native Agent에게 요청하세요" aria-label="메시지"></textarea>
          <button id="send" type="submit" aria-label="전송">↑</button>
        </form>
        <p>AI가 생성한 답변은 검토가 필요할 수 있습니다. 쓰기 작업은 실행 전 승인을 요청합니다.</p>
      </div>
    </main>

    <aside id="trace-panel" class="trace-panel" aria-hidden="true">
      <div class="trace-header"><div><span>RUN INSPECTOR</span><h3>실행 추적</h3></div><button id="trace-close">×</button></div>
      <div id="trace-summary" class="trace-summary"></div>
      <div id="trace-events" class="trace-events"></div>
    </aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
